<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Fútbol - Categoría 2020</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-orange: #ff7b00;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
            --green-badge: #1b4d2e;
            --green-text: #4caf50;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* Encabezado / Shield */
        .header {
            text-align: center;
            padding: 16px 0;
        }

        .header h1 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
            color: var(--text-muted);
        }

        .header h2 {
            font-size: 1.4rem;
            color: var(--accent-orange);
            margin: 4px 0 0 0;
        }

        /* Botones de navegación */
        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 16px 0;
        }

        .btn {
            background-color: #2a2a2a;
            color: var(--text-color);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn.active {
            border-color: var(--accent-orange);
            color: var(--accent-orange);
        }

        /* Rejilla de Estadísticas principales */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid #2a2a2a;
        }

        .stat-item {
            text-align: center;
            padding: 8px 0;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-orange);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* Selector de Torneos */
        .tournament-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid #2a2a2a;
        }

        .tab {
            padding: 14px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--text-muted);
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            color: var(--accent-orange);
            border-bottom-color: var(--accent-orange);
            background-color: rgba(255, 123, 0, 0.05);
        }

        /* Sección de Fixture */
        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-orange);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Tarjeta de Fecha / Partido */
        .match-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #2a2a2a;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }

        .match-round {
            color: var(--accent-orange);
            font-weight: bold;
            text-transform: uppercase;
        }

        .match-date {
            color: var(--text-muted);
        }

        .match-status {
            background-color: var(--green-badge);
            color: var(--green-text);
            font-weight: bold;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* Scoreboard */
        .match-body {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
        }

        .team-name {
            font-size: 1.05rem;
            font-weight: 600;
            width: 35%;
        }

        .team-name.right {
            text-align: right;
        }

        .vs-badge {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .score-box {
            background-color: #121212;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 4px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Header -->
    <div class="header">
        <h1>Baby Fútbol · Temporada 2026</h1>
        <h2>CATEGORÍA 2020</h2>
    </div>

    <!-- Menú de Accesos Rápidos -->
    <div class="nav-buttons">
        <button class="btn active">⚽ Liga</button>
        <button class="btn">🥇 Metro</button>
        <button class="btn">📊 Tabla</button>
        <button class="btn">📍 Canchas</button>
        <button class="btn">🏃 Prácticas</button>
    </div>

    <!-- Resumen de Estadísticas -->
    <div class="stats-grid">
        <div class="stat-item">
            <div class="stat-value">13</div>
            <div class="stat-label">Jugados</div>
        </div>
        <div class="stat-item">
            <div class="stat-value">11</div>
            <div class="stat-label">Ganados</div>
        </div>
        <div class="stat-item">
            <div class="stat-value">64</div>
            <div class="stat-label">Goles a Favor</div>
        </div>
        <div class="stat-item">
            <div class="stat-value">33</div>
            <div class="stat-label">Puntos</div>
        </div>
    </div>

    <!-- Pestañas Torneos -->
    <div class="tournament-tabs">
        <div class="tab active">🏆 LIGA PRADO</div>
        <div class="tab">🥇 METROPOLITANO</div>
    </div>

    <!-- Fixture -->
    <div class="section-title">⚽ FIXTURE</div>

    <!-- Fecha de Ejemplo -->
    <div class="match-card">
        <div class="match-header">
            <span class="match-round">Fecha 1</span>
            <span class="match-date">16/03/2026</span>
            <span class="match-status">JUGADO</span>
        </div>
        <div class="match-body">
            <div class="team-name">Bochas</div>
            <span class="vs-badge">vs</span>
            <div class="team-name right">Urreta</div>
            <div class="score-box">0 : 3</div>
        </div>
    </div>

</div>

</body>
</html>
